[project]
name = "ogpt"
version = "0.1.0"
description = "Open Government Project Tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.6",
    "django-bootstrap4>=25.2",
    "django-filter>=25.1",
    "django-tables2>=2.7.5",
    "djangorestframework>=3.16.1",
    "psycopg[binary]>=3.2.10",
    "rust-just>=1.42.4",
    "tablib>=3.8.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.0.0",
    "django-extensions>=4.1",
    "django-upgrade>=1.28.0",
    "pytest>=8.4.2",
    "pyupgrade>=3.20.0",
    "ruff>=0.13.0",
]
